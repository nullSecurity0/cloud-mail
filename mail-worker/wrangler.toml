name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"			#d1数据库绑定名默认不可修改
database_name = "mail_db"		#d1数据库名字
database_id = "abc8f3a2-93ef-4a67-bbdb-01d6c55486bf"		#d1数据库id

[[kv_namespaces]]
binding = "kv"			#kv绑定名默认不可修改
id = "5361517e014943549c9c63fc96101d9f"					#kv数据库id

# [[r2_buckets]]
# binding = "r2"			#r2对象存储绑定名默认不可修改
# bucket_name = "email"		#r2对象存储桶的名字

#[[send_email]]
#name = "email"			#CF发件, 配置后优先使用

[[send_email]]
name = "forward"		#站内转发到已验证的其他邮箱，不限制单个地址

[ai]
binding = "ai"

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]	#每小时执行；resetDaySendCount 仅在 UTC 0 点生效


[vars]
ai_model = "@cf/meta/llama-3.1-8b-instruct-fast"			#ai模型,不填默认使用@cf/meta/llama-3.1-8b-instruct-fast
analysis_cache = false			#是否开启分析数据缓存
orm_log = false			#是否sql日志
domain = ["nullsecurity.cc", "11101001.xyz", "zvzoo.com"]				#邮件域名可可配置多个 示例: ["example1.com","example2.com"]
admin = "admin@nullsecurity.cc"					#管理员的邮箱	示例: admin@example.com
jwt_secret = "nullsec_mail_jwt_98f438a2c7e1903e"			#jwt令牌的密钥,随便填一串字符串

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
