name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "mail_db"
database_id = "abc8f3a2-93ef-4a67-bbdb-01d6c55486bf"

[[kv_namespaces]]
binding = "kv"
id = "5361517e014943549c9c63fc96101d9f"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]

[vars]
orm_log = false
domain = ["nullsecurity.cc", "11101001.xyz"]
admin = "admin@nullsecurity.cc"
jwt_secret = "nullsec_mail_jwt_98f438a2c7e1903e"

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"